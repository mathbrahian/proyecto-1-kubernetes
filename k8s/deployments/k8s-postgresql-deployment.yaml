apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: 'postgres:14'
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: "POSTGRES_USER"
              valueFrom:
                secretKeyRef:
                  name: appsecrets 
                  key: DB_SPORT_USER
            - name: "POSTGRES_DB"
              valueFrom:
                secretKeyRef:
                  name: appsecrets 
                  key: DB_SPORT_NAME
            - name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: appsecrets 
                  key: DB_SPORT_PASSWORD