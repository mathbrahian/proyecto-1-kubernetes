apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: $IMAGE_AUTH
          resources:
            limits:
              memory: "1200Mi"
              cpu: "1.2"
            requests:
              memory: "1100Mi"
              cpu: "1.1"
          ports:
            - containerPort: 80
          imagePullPolicy: Always

          env:
            - name: "DATABASE_AUTH_URL"
              valueFrom:
                secretKeyRef:
                  name: appsecrets 
                  key: DATABASE_AUTH_URL
                  
---

apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: auth-config
spec:
  healthCheck:
    checkIntervalSec: 30
    port: 80
    type: HTTP
    requestPath: /auth/ping